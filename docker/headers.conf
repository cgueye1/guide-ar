# ══════════════════════════════════════════════════════════
#  En-têtes communs à toutes les réponses.
#
#  À inclure dans CHAQUE location : dès qu'un bloc déclare son
#  propre add_header, nginx cesse d'hériter de ceux du parent.
# ══════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff"                    always;
add_header X-Frame-Options        "SAMEORIGIN"                 always;
add_header Referrer-Policy        "no-referrer-when-downgrade" always;

# La caméra et la position doivent rester autorisées sur cette origine.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
